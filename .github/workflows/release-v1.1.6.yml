name: Publish v1.1.6 release

on:
  push:
    branches: [claude/charming-cerf-yjtzxu]
    paths: [.github/workflows/release-v1.1.6.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.6 >/dev/null 2>&1; then
            echo "v1.1.6 release already exists"; exit 0
          fi
          tail -n +3 RELEASE_NOTES_v1.1.6.md > notes.md
          gh release create v1.1.6 --target "$GITHUB_SHA" --title "Mac 리모컨 v1.1.6" --notes-file notes.md --latest
