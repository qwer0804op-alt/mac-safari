<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac 리모컨">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Mac 리모컨</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">⌘</span><strong>Mac 리모컨</strong></div>
      <div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">연결 확인 중</span></div>
    </header>

    <section class="login card" id="loginView" hidden>
      <h1>내 Mac에 연결하기</h1>
      <p class="muted" id="codeHint">Mac 리모컨에 표시된 4자리 코드를 입력해.</p>
      <form id="loginForm" novalidate>
        <label for="code">4자리 연결 코드</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="····" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="codeHint loginMessage" required>
        <button class="primary" type="submit" id="loginButton"><span id="loginButtonLabel">연결하기</span> <span aria-hidden="true">↗</span></button>
      </form>
      <p class="feedback" id="loginMessage" role="status"></p>
    </section>

    <section class="control" id="controlView" hidden>
      <div class="intro"><h1>원격 제어</h1><button class="quiet" id="logoutButton">연결 종료</button></div>
      <div class="screen-card card">
        <div class="screen-toolbar"><span>Mac 화면</span><button class="icon-button" id="refreshButton" aria-label="화면 새로고침" title="새로고침">↻</button></div>
        <div class="screen-wrap"><img id="screen" alt="Mac 화면. 누르면 해당 위치를 클릭해." draggable="false"><div class="screen-placeholder" id="screenPlaceholder"><span class="spinner" id="screenSpinner" aria-hidden="true"></span><span id="screenMessage">화면을 불러오는 중</span></div></div>
        <div class="screen-footer"><span>탭하면 클릭</span><span>밀면 스크롤</span><span id="lastUpdate">연결 중</span></div>
      </div>
      <div class="tools-grid">
        <section class="tool-card card"><div class="section-title"><h2>텍스트 입력</h2><span class="section-icon" aria-hidden="true">⌨</span></div><p class="description">Mac 화면에서 입력할 위치를 누른 뒤 내용을 보내.</p><form id="textForm"><textarea id="textInput" rows="3" maxlength="2000" placeholder="여기에 입력해" aria-label="보낼 텍스트"></textarea><button class="primary" type="submit">텍스트 보내기 <span aria-hidden="true">↗</span></button></form></section>
        <section class="tool-card card"><div class="section-title"><h2>키와 스크롤</h2></div><div class="key-grid"><button data-key="escape">esc</button><button data-key="tab">tab</button><button data-key="backspace" aria-label="백스페이스">⌫</button><button data-key="enter">enter ↵</button><button data-key="left" aria-label="왼쪽 화살표">←</button><button data-key="up" aria-label="위쪽 화살표">↑</button><button data-key="down" aria-label="아래쪽 화살표">↓</button><button data-key="right" aria-label="오른쪽 화살표">→</button></div><div class="scroll-controls"><button data-scroll="-400">↑ 위로 스크롤</button><button data-scroll="400">↓ 아래로 스크롤</button></div></section>
      </div>
      <p class="feedback control-feedback" id="controlMessage" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
